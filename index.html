<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolução — Gym Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a2e;
      --accent: #e94560;
      --accent-2: #ff6b81;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --ok: #22c55e;
      --warn: #f59e0b;
      --radius: 22px;
      --ease: 0.18s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    /* Hero compacto */
    .hero {
      background: linear-gradient(135deg, var(--card), #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: calc(var(--radius) + 8px);
      padding: 24px 32px;
      margin-bottom: 24px;
    }
    .hero-top {
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 12px; margin-bottom: 12px;
    }
    .hero-top h1 {
      font-size: clamp(1.5rem, 2.5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0;
    }
    .hero-meta {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .hero-meta .dot { margin: 0 6px; }
    .hero-period {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      margin-top: 8px;
    }
    .range-picker { display: flex; gap: 6px; flex-wrap: wrap; }
    .range-picker button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }
    .range-picker button.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .summary-slot { margin-top: 14px; }
    .summary-card {
      background: rgba(233,69,96,0.08);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 24px;
      overflow-x: auto;
    }
    .tabs-nav button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tabs-nav button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* KPIs */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi {
      background: rgba(15,15,15,0.35);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius);
      padding: 20px 22px;
      transition: all var(--ease);
    }
    .kpi:hover {
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
    }
    .kpi .value {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .kpi .label {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .kpi .delta {
      font-size: 0.75rem;
      margin-top: 6px;
      color: var(--muted);
    }
    .kpi .delta.up { color: var(--ok); }
    .kpi .delta.down { color: var(--warn); }
    .kpi .delta.flat { color: var(--muted); }

    /* Charts */
    .chart-box {
      background: rgba(15,15,15,0.35);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .chart-box h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
    }
    canvas {
      width: 100% !important;
      height: auto !important;
    }
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .chart-row .chart-box { margin-bottom: 0; }
    @media (max-width: 900px) {
      .chart-row { grid-template-columns: 1fr; }
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    th {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody tr {
      cursor: pointer;
      transition: background var(--ease);
    }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    /* Heatmap */
    .heatmap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
    }
    .heat-month {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .heat-month-label {
      font-size: 0.75rem;
      color: var(--muted);
      min-width: 56px;
    }
    .heat-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .heat-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      background: rgba(255,255,255,0.04);
      min-height: 10px;
    }
    .heat-cell[data-level="1"] { background: rgba(233,69,96,0.25); }
    .heat-cell[data-level="2"] { background: rgba(233,69,96,0.5); }
    .heat-cell[data-level="3"] { background: rgba(233,69,96,0.75); }
    .heat-cell[data-level="4"] { background: var(--accent); }
    .heat-cell[data-level]:not([data-level="0"]) { cursor: help; }
    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
      margin-top: 12px;
      font-size: 0.75em;
      color: var(--muted);
    }
    .heatmap-legend .heat-cell {
      display: inline-block;
      width: 12px;
      height: 12px;
      min-height: 0;
      aspect-ratio: auto;
    }

    /* PR grid */
    .pr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .pr-group-heading {
      grid-column: 1 / -1;
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .pr-group-heading:first-child {
      border-top: none;
      margin-top: 0;
      padding-top: 0;
    }
    .pr-card {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .pr-name {
      font-weight: 600;
      font-size: 0.9em;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pr-weight {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--accent-2);
    }
    .pr-meta {
      font-size: 0.72em;
      color: var(--muted);
      display: flex;
      gap: 8px;
    }
    .pr-sparkline {
      height: 28px;
      margin-top: 4px;
    }
    .pr-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.62em;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .pr-badge.new { background: var(--ok); color: #000; }
    .pr-badge.evolving { background: var(--accent-2); color: #000; }
    .pr-badge.stagnant { background: var(--warn); color: #000; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 600px;
      width: 100%;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px;
      background: transparent; border: none;
      color: var(--text); font-size: 1.6rem;
      cursor: pointer;
      font-family: inherit;
    }
    .modal-date { color: var(--muted); margin: 8px 0 16px; }
    .modal-stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
    .modal-hint { color: var(--muted); font-size: 0.85rem; }

    /* Sessions mobile cards */
    .sessions-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .session-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
    }
    .session-card .session-date { font-size: 0.8rem; color: var(--muted); }
    .session-card .session-name { font-weight: 600; margin: 4px 0; }
    .session-card .session-stats { display: flex; gap: 12px; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; }

    @media (max-width: 768px) {
      #sessionsTable { display: none; }
    }
    @media (min-width: 769px) {
      .sessions-cards { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-top">
        <h1 id="appTitle">Evolução de William</h1>
        <div class="hero-meta">
          <span id="lastWorkout"></span>
          <span class="dot">·</span>
          <span>Atualizado <span id="updatedAt">--:--</span></span>
        </div>
      </div>
      <div class="hero-period" id="rangePickerHost"></div>
      <div id="summarySlot" class="summary-slot"></div>
    </header>

    <nav class="tabs-nav">
      <button data-tab="overview" class="active">Visão Geral</button>
      <button data-tab="strength">Força</button>
      <button data-tab="consistency">Consistência</button>
      <button data-tab="history">Histórico</button>
    </nav>

    <section class="tab-panel" data-tab="overview">
      <section class="kpis" id="kpis"></section>
      <div class="chart-row">
        <div class="chart-box">
          <h2>Volume Mensal</h2>
          <canvas id="volumeChart"></canvas>
        </div>
        <div class="chart-box">
          <h2>Frequência Semanal</h2>
          <canvas id="weekdayChart"></canvas>
        </div>
      </div>
    </section>

    <section class="tab-panel" data-tab="strength" hidden>
      <div class="chart-box">
        <h2>Top 10 por 1RM</h2>
        <canvas id="oneRmChart"></canvas>
      </div>
      <section class="chart-box">
        <h2>Recordes Pessoais</h2>
        <div id="prGrid" class="pr-grid"></div>
      </section>
    </section>

    <section class="tab-panel" data-tab="consistency" hidden>
      <section class="chart-box">
        <h2>Aderência Semanal</h2>
        <div id="adherenceCards" class="kpis"></div>
      </section>
      <section class="chart-box">
        <h2>Volume Diário</h2>
        <div id="heatmap" class="heatmap"></div>
        <p class="heatmap-legend">
          <span>Menos</span>
          <span class="heat-cell" data-level="0"></span>
          <span class="heat-cell" data-level="1"></span>
          <span class="heat-cell" data-level="2"></span>
          <span class="heat-cell" data-level="3"></span>
          <span class="heat-cell" data-level="4"></span>
          <span>Mais</span>
        </p>
      </section>
    </section>

    <section class="tab-panel" data-tab="history" hidden>
      <section class="chart-box">
        <h2>Últimas Sessões</h2>
        <table id="sessionsTable">
          <thead>
            <tr>
              <th>Data</th>
              <th>Nome</th>
              <th>Exercícios</th>
              <th>Séries</th>
              <th>Volume</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="sessionsCards" class="sessions-cards"></div>
      </section>
    </section>
  </div>

  <!--
    Chart.js 4.4.7 via cdn.jsdelivr.net.
  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <!-- Módulos (namespaces globais, ordem importa) -->
  <script defer src="js/i18n.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/drop.js"></script>
  <script defer src="js/summary.js"></script>
  <script defer src="js/tabs.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
